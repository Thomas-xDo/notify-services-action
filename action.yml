name: "Notify via notify-services"
description: "Send a notification through notify-services (fan-out to Slack/Discord/Telegram/webhook)"
author: "Thomas Labs"

inputs:
  api-key:
    description: "notify-services App API key (nsvc_...). Store it as a repo secret, never inline."
    required: true
  service:
    description: "Free-form label for the caller (e.g. the repo/workflow name)"
    required: true
  message:
    description: >-
      Notification body, sent as it is. Leave it empty to have the action
      build the standard CI message from `event`, `jobs`/`status` and the run.
    required: false
    default: ""
  event:
    description: "Standard message: what ran (deploy, build, test, backup, release, rollback, or any word)"
    required: false
    default: "deploy"
  jobs:
    description: "Standard message: the needs context as JSON (toJSON of needs); the result and the per-job line come from it"
    required: false
    default: ""
  status:
    description: "Standard message: success | failure | cancelled. Overrides the result worked out from `jobs`"
    required: false
    default: ""
  target:
    description: "Standard message: where it went, added to the title (e.g. dev, production)"
    required: false
    default: ""
  details:
    description: "Standard message: extra lines put before the run link (e.g. `Image: <tag>`)"
    required: false
    default: ""
  title:
    description: "Notification title. With the standard message it replaces the built title"
    required: false
    default: ""
  level:
    description: "info | warning | error | critical. Empty: info, or with the standard message the level that fits the result"
    required: false
    default: ""
  to:
    description: >-
      Comma-separated destination types to target (slack, discord,
      telegram, webhook). Leave empty to fan out to every enabled
      destination on the App (default).
    required: false
    default: ""
  api-url:
    description: "notify-services API base URL"
    required: false
    default: "https://notify-api.thomas-labs.com"

runs:
  using: "composite"
  steps:
    - name: Send notification
      shell: bash
      env:
        NOTIFY_API_KEY: ${{ inputs.api-key }}
        NOTIFY_SERVICE: ${{ inputs.service }}
        NOTIFY_MESSAGE: ${{ inputs.message }}
        NOTIFY_EVENT: ${{ inputs.event }}
        NOTIFY_JOBS: ${{ inputs.jobs }}
        NOTIFY_STATUS: ${{ inputs.status }}
        NOTIFY_TARGET: ${{ inputs.target }}
        NOTIFY_DETAILS: ${{ inputs.details }}
        NOTIFY_TITLE: ${{ inputs.title }}
        NOTIFY_LEVEL: ${{ inputs.level }}
        NOTIFY_TO: ${{ inputs.to }}
        NOTIFY_API_URL: ${{ inputs.api-url }}
      run: '"$GITHUB_ACTION_PATH/notify.sh"'
