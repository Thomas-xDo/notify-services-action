name: Self-test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify (success path)
        uses: ./
        with:
          api-key: ${{ secrets.NOTIFY_API_KEY }}
          service: notify-services-action-self-test
          level: info
          message: "Self-test from notify-services-action, run ${{ github.run_id }}"
