name: Self-test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify (to=telegram)
        uses: ./
        with:
          api-key: ${{ secrets.NOTIFY_API_KEY }}
          service: notify-services-action-self-test
          level: info
          to: telegram
          message: "Self-test with to=telegram, run ${{ github.run_id }}"
